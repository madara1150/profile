name: Strict CI Checks

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-check:
    name: Frontend (Next.js) Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'yarn'
        
    - name: Install Dependencies
      run: yarn install --frozen-lockfile
      
    - name: Strict Linting
      run: yarn lint
      
    - name: TypeScript Type Checking
      run: npx tsc --noEmit
      
    - name: Test Build Production Bundle
      run: yarn build
      
  backend-check:
    name: Backend (Go) Checks
    runs-on: ubuntu-latest
    # Wait for frontend dependencies and code checks to pass first (optional, but good for saving Go compute time)
    needs: frontend-check
    
    defaults:
      run:
        working-directory: ./backend
        
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.21'
        cache: true
        cache-dependency-path: ./backend/go.sum
        
    - name: Download Go Modules
      run: go mod download
      
    - name: Verify Go Formatting
      run: |
        if [ -n "$(go fmt ./...)" ]; then
          echo "Go code is not formatted properly. Please run 'go fmt ./...' locally and commit the changes."
          exit 1
        fi
        
    - name: Run Go Vet (Static Analysis)
      run: go vet ./...
      
    - name: Test Go Build
      run: go build -v ./...
